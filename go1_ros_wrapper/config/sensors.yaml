sensors:
  enable_realsense: true
  enable_ellipse: true
  use_ntrip: false

realsense:
  camera_namespace: /go1/sensors/realsense
  camera_name: d435i
  serial_no: "''"
  depth_profile: 640,480,15
  color_profile: 640,480,15
  enable_color: true
  enable_imu: false

ellipse:
  namespace: /go1/sensors/ellipse
  port: /dev/ttyUSB0
  baud: 921600
  frame_id: ellipse_link
  frequency: 400

ntrip:
  namespace: /go1/sensors/ellipse/ntrip_client
  host: macorsrtk.massdot.state.ma.us
  port: 10000
  mountpoint: RTCM3_MAX
  username: ''
  password: ''
  reconnect_attempt_max: 120
  reconnect_attempt_wait_seconds: 5
  rtcm_timeout_seconds: 10
